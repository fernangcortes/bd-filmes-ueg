# Banco de Personagens CriaLab|UEG — PostgreSQL 16 + pgvector
# Uso: docker compose up -d   (ou simplesmente execute iniciar.bat)
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: bd-filmes-ueg-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: crialab
      POSTGRES_USER: crialab
      POSTGRES_PASSWORD: crialab_local_dev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # O schema é aplicado automaticamente na primeira subida do banco
      - ./src/banco/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crialab -d crialab"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
