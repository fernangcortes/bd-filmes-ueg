        - { slug: campusmetropolitano, nome: "Câmpus Metropolitano — Aparecida de Goiânia",       campus: "Câmpus Metropolitano" }
        - { slug: eseffego,            nome: "UnU Goiânia — ESEFFEGO",                            campus: "Câmpus Metropolitano" }
        - { slug: laranjeiras,         nome: "UnU Goiânia — Laranjeiras",                         campus: "Câmpus Metropolitano" }
        - { slug: inhumas,             nome: "UnU Inhumas",                                       campus: "Câmpus Metropolitano" }
        - { slug: senadorcanedo,       nome: "UnU Senador Canedo",                                campus: "Câmpus Metropolitano" }
        - { slug: trindade,            nome: "UnU Trindade",                                      campus: "Câmpus Metropolitano" }
        # Câmpus Nordeste — Sede: Formosa
        - { slug: campusnordeste,      nome: "Câmpus Nordeste — Formosa",                         campus: "Câmpus Nordeste" }
        - { slug: camposbelos,         nome: "UnU Campos Belos",                                  campus: "Câmpus Nordeste" }
